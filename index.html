<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>段考時程表Pro</title>
    <style>
        /* --- 1. 基礎與 RWD 佈局 --- */
        :root { --sidebar-bg: #fcfcfc; --main-bg: #f0f2f5; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; }

        .dashboard-container { 
            display: grid; 
            grid-template-columns: 50% 50%; 
            grid-template-rows: 1fr 40px; 
            height: 100vh; 
        }

        /* 手機版 RWD 樣式 */
        @media (max-width: 768px) {
            .dashboard-container { grid-template-columns: 100%; }
            .main-board { display: none; } /* 隱藏右側 */
            .sidebar-fixed { padding-top: 60px !important; }
            #mobile-clock-header { display: flex !important; }
        }

        #mobile-clock-header {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 50px;
            background: #fff; border-bottom: 1px solid #ddd; z-index: 5000;
            justify-content: center; align-items: center; font-family: monospace; font-weight: bold; font-size: 24px;
        }

        .panel { position: relative; padding: 25px; overflow-y: auto; transition: background 0.4s ease; background-size: cover !important; }
        .sidebar-fixed { background: var(--sidebar-bg); border-right: 2px solid #ddd; }
        .main-board { background: var(--main-bg); overflow: hidden; }

        /* --- 2. 介面遮罩與動畫 --- */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; }
        #save-loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #27ae60; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .login-box { background: #fff; color: #333; padding: 40px; border-radius: 12px; width: 380px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; }
        .btn-primary { background: #3498db; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; cursor: pointer; }

        /* --- 3. 工具列與表格 --- */
        .toolbar { background: rgba(255,255,255,0.85); padding: 8px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
        .btn { padding: 5px 10px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: white; font-size: 12px; font-weight: bold; }
        .btn-save { background: #27ae60 !important; color: white !important; border: none; }
        .btn-lock { background: #f39c12 !important; color: white !important; border: none; }

        .exam-table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.7); table-layout: fixed; }
        .exam-table th, .exam-table td { border: 1px solid #ccc; padding: 6px; text-align: center; overflow-wrap: anywhere; vertical-align: middle; position: relative; }
        .resizer { position: absolute; right: 0; top: 0; width: 6px; cursor: col-resize; height: 100%; z-index: 5; }

        .energy-bar { width: 100%; height: 14px; background: #eee; border-radius: 7px; overflow: hidden; }
        .energy-fill { width: 100%; height: 100%; background: #4caf50; transition: width 1s; }
        .mgmt-cell { display: flex; gap: 4px; align-items: center; justify-content: center; }
        .btn-sm { width: 24px; height: 24px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; }

        /* --- 4. 小工具 --- */
        .widget { position: absolute; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); padding: 35px 15px 15px; min-width: 100px; resize: both; overflow: hidden; z-index: 10; }
        .widget-handle { position: absolute; top: 0; left: 0; width: 100%; height: 35px; background: rgba(0,0,0,0.03); cursor: move; }
        .widget-ctrl { position: absolute; top: 6px; right: 8px; display: flex; gap: 4px; z-index: 30; }
        .btn-close { background: #ff5f56; color: white; border: none; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; cursor: pointer; }

        .clock-digit { font-family: monospace; font-weight: bold; text-align: center; pointer-events: none; width: 100%; }
        .style-hacker { background: #000 !important; color: #00ff00 !important; border: 2px solid #333; }
        .hand { transform-origin: 50% 50%; stroke-linecap: round; transition: transform 0.5s; }
        
        .widget-note { background: #fff9c4; }
        .widget-announce { border-left: 8px solid #e74c3c; }
        .widget textarea { width: 100%; border: none; background: transparent; outline: none; resize: none; font-family: inherit; font-size: 16px; }

        /* 鎖定狀態隱藏元素 */
        .locked .resizer, .locked .widget-ctrl, .locked .widget-handle, .locked .mgmt-cell button, .locked .mgmt-cell input { display: none !important; }
        .locked .widget { resize: none !important; }

        /* 背景選單 */
        .bg-menu { display: none; position: absolute; background: white; border: 1px solid #ccc; padding: 15px; border-radius: 10px; z-index: 2000; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 240px; }
        .bg-option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .bg-btn { width: 100%; height: 35px; border: 1px solid #ddd; cursor: pointer; border-radius: 4px; font-size: 11px; }

        .footer { grid-column: 1/3; background: #2c3e50; color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    </style>
</head>
<body id="main-body">

<!-- 手機版頂部時鐘 -->
<div id="mobile-clock-header">00:00:00</div>

<!-- 存檔 Loading -->
<div id="save-loading">
    <div class="spinner"></div>
    <div>雲端存檔中...</div>
</div>

<!-- 登入遮罩 -->
<div id="login-overlay">
    <div class="login-box">
        <h2 id="auth-title">登入儀表板</h2>
        <div id="input-area">
            <input type="text" id="user-id" placeholder="帳號 (流水號 0001)">
            <input type="password" id="user-pw" placeholder="密碼">
        </div>
        <button type="button" class="btn-primary" onclick="handleAuth()">進入系統</button>
        <button type="button" style="background:#95a5a6; color:white; margin-top:5px; width:100%; padding:12px; border-radius:6px; border:none; cursor:pointer;" onclick="handleGuestLogin()">訪客登入</button>
        <span class="link" onclick="toggleAuthMode()" id="auth-toggle">第一次登入請按此 (設定密碼)</span>
    </div>
</div>

<div class="dashboard-container">
    <!-- 左側面板 -->
    <aside class="panel sidebar-fixed" id="left-panel">
        <div class="toolbar">
            <h2 contenteditable="true" id="db-title">本學期段考時程</h2>
            <button class="btn" onclick="addTableRow()">+新增</button>
            <button class="btn" onclick="changeFontSize(2)">A+</button>
            <button class="btn" onclick="changeFontSize(-2)">A-</button>
            <button class="btn" onclick="openBgMenu('left', event)">🎨背景</button>
            <button class="btn btn-lock" id="btn-lock" onclick="toggleLock()">🔓 解鎖中</button>
            <button class="btn btn-save" onclick="saveData()">💾存檔</button>
            <button class="btn" onclick="logout()">登出</button>
        </div>
        <table class="exam-table" id="exam-table">
            <thead>
                <tr>
                    <th id="th-1" style="width:25%">科目</th>
                    <th id="th-2" style="width:20%">時間</th>
                    <th id="th-3" style="width:25%">能量條</th>
                    <th id="th-4" style="width:30%">管理</th>
                </tr>
            </thead>
            <tbody id="exam-tbody"></tbody>
        </table>
    </aside>

    <!-- 右側面板 -->
    <main class="panel main-board" id="right-panel">
        <div class="toolbar">
            <button class="btn" onclick="createWidget('digital', null, 'default')">+數位(白)</button>
            <button class="btn" onclick="createWidget('digital', null, 'hacker')">+數位(黑綠)</button>
            <button class="btn" onclick="createWidget('analog')">+指針時鐘</button>
            <button class="btn" onclick="createWidget('note')">+便利貼</button>
            <button class="btn" onclick="createWidget('announce')">+公告欄</button>
            <button class="btn" onclick="openBgMenu('right', event)">🎨背景</button>
        </div>
    </main>

    <div id="bg-selector" class="bg-menu">
        <div class="bg-option-grid">
            <button class="bg-btn" style="background:#ffffff" onclick="setPanelBg('#ffffff')">純白</button>
            <button class="bg-btn" style="background:#f0f2f5" onclick="setPanelBg('#f0f2f5')">簡約灰</button>
            <button class="bg-btn" style="background:linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)" onclick="setPanelBg('linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)')">海洋藍</button>
            <button class="bg-btn" style="background:linear-gradient(to right, #243b55, #141e30)" onclick="setPanelBg('linear-gradient(to right, #243b55, #141e30)', 'white')">午夜藍</button>
        </div>
    </div>

    <footer class="footer">帳號：<span id="display-id">---</span> | 奕鈞老師製作 &copy; 2026</footer>
</div>

<script>
    // --- 配置 ---
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwN2TyQCQSZ8X8oTMzOPLoSv4upcRO5TuI3Fogve-nygWoWh5iX1ZrLslhMDgnwrzkWGw/exec'; 

    let currentUser = { id: '', pw: '' };
    let isRegisterMode = false;
    let activePanelId = '';
    let isLocked = false;

// --- 1. 登入與註冊介面切換 ---
function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    const authTitle = document.getElementById('auth-title');
    const inputArea = document.getElementById('input-area');
    const authBtn = document.querySelector('button[onclick="handleAuth()"]');
    const authToggle = document.getElementById('auth-toggle');

    if (isRegisterMode) {
        // 修改這裡的大標題
        authTitle.innerText = "設定新密碼"; 
        // 修改這裡的次標題提示文字
        inputArea.innerHTML = 
            '<p style="font-size:15px; color:#e67e22; margin-bottom:10px; font-weight:bold;">' +
            '系統會配發 4 個數字的帳號給你' +
            '</p>' +
            '<input type="password" id="user-pw" placeholder="請設定 4 位數字密碼" maxlength="4">';
        
        authBtn.innerText = "獲取帳號並登入";
        authToggle.innerText = "已有帳號？返回登入";
    } else {
        authTitle.innerText = "登入儀表板";
        inputArea.innerHTML = 
            '<input type="text" id="user-id" placeholder="帳號 (流水號 0001)">' +
            '<input type="password" id="user-pw" placeholder="密碼">';
        
        authBtn.innerText = "進入系統";
        authToggle.innerText = "第一次登入請按此 (設定密碼)";
    }
}

    // --- 2. 介面鎖定功能 ---
    function toggleLock() {
        isLocked = !isLocked;
        const btn = document.getElementById('btn-lock');
        const mainBody = document.getElementById('main-body');
        const dbTitle = document.getElementById('db-title');
        
        if (isLocked) {
            btn.innerText = "🔒 已鎖定";
            btn.style.background = "#e74c3c";
            mainBody.classList.add('locked');
            dbTitle.contentEditable = "false";
            document.querySelectorAll('[contenteditable="true"]').forEach(el => el.dataset.wasEditable = "true");
            document.querySelectorAll('[contenteditable]').forEach(el => el.contentEditable = "false");
            document.querySelectorAll('textarea, input:not([type="color"])').forEach(el => el.readOnly = true);
        } else {
            btn.innerText = "🔓 解鎖中";
            btn.style.background = "#f39c12";
            mainBody.classList.remove('locked');
            dbTitle.contentEditable = "true";
            document.querySelectorAll('[data-was-editable="true"]').forEach(el => el.contentEditable = "true");
            document.querySelectorAll('textarea, input:not([type="color"])').forEach(el => el.readOnly = false);
        }
    }

    // --- 3. 存取邏輯 (含限制) ---
    async function saveData() {
        if (!currentUser.id || currentUser.id === "訪客") return alert("訪客無法存檔！");
        
        const data = {
            title: document.getElementById('db-title').innerText,
            leftBg: document.getElementById('left-panel').style.background,
            rightBg: document.getElementById('right-panel').style.background,
            tableFontSize: document.getElementById('exam-table').style.fontSize,
            isLocked: isLocked,
            colWidths: [document.getElementById('th-1').style.width, document.getElementById('th-2').style.width, document.getElementById('th-3').style.width, document.getElementById('th-4').style.width],
            table: [], widgets: []
        };

        document.querySelectorAll('#exam-tbody tr').forEach(row => {
            data.table.push({ subject: row.cells[0].innerText, time: row.cells[1].innerText, bold: row.style.fontWeight === 'bold', color: row.style.color });
        });

        document.querySelectorAll('.widget').forEach(w => {
            let type = w.classList.contains('widget-digital') ? 'digital' : (w.classList.contains('widget-analog') ? 'analog' : (w.classList.contains('widget-announce') ? 'announce' : 'note'));
            const txt = w.querySelector('textarea');
            data.widgets.push({ 
                type, top: w.style.top, left: w.style.left, width: w.style.width, height: w.style.height, 
                content: txt ? txt.value : '', extra: w.querySelector('input') ? w.querySelector('input').value : '',
                fontSize: txt ? txt.style.fontSize : '16px', hacker: w.classList.contains('style-hacker')
            });
        });

        const jsonStr = JSON.stringify(data);
        if (jsonStr.length > 20000) return alert("存檔失敗：資料長度超過 20000，請刪除部分內容。");

        document.getElementById('save-loading').style.display = 'flex';
        try {
            const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "save", userID: currentUser.id, password: currentUser.pw, dashboardData: jsonStr }) });
            const result = await res.json(); alert(result.message);
        } catch (e) { alert("存檔失敗，網路繁忙。"); }
        finally { document.getElementById('save-loading').style.display = 'none'; }
    }

    function loadDashboard(data) {
        if (!data) return;
        document.getElementById('db-title').innerText = data.title || "本學期段考時程";
        document.getElementById('left-panel').style.background = data.leftBg || "";
        document.getElementById('right-panel').style.background = data.rightBg || "";
        document.getElementById('exam-table').style.fontSize = data.tableFontSize || "16px";
        if (data.colWidths) data.colWidths.forEach((w, i) => { if(w) document.getElementById('th-' + (i+1)).style.width = w; });
        document.getElementById('exam-tbody').innerHTML = "";
        if(data.table) data.table.forEach(item => addTableRow(item));
        if(data.widgets) data.widgets.forEach(w => createWidget(w.type, w, w.hacker ? 'hacker' : 'default'));
        if(data.isLocked) toggleLock();
    }

    // --- 4. 表格與科目長度限制 ---
    function addTableRow(data = null) {
        const tr = document.createElement('tr');
        if(data && data.bold) tr.style.fontWeight = 'bold';
        if(data && data.color) tr.style.color = data.color;
        tr.innerHTML = `<td contenteditable="true">${data ? data.subject : '新科目'}</td>` +
            `<td contenteditable="true">${data ? data.time : '08:00-09:00'}</td>` +
            `<td><div class="energy-bar"><div class="energy-fill"></div></div></td>` +
            `<td><div class="mgmt-cell"><button class="btn-sm" onclick="toggleRowBold(this)">B</button>` +
            `<input type="color" value="${data?.color || '#000000'}" onchange="this.closest('tr').style.color=this.value" style="width:20px;height:20px;border:none;background:none;cursor:pointer;">` +
            `<button class="btn-sm" style="color:red" onclick="this.closest('tr').remove()">✖</button></div></td>`;
        
        // 限制科目名稱 20 字
        const subCell = tr.cells[0];
        subCell.addEventListener('input', function() {
            if (this.innerText.length > 20) {
                this.innerText = this.innerText.substring(0, 20);
                alert("科目名稱上限為 20 字！");
            }
        });

        document.getElementById('exam-tbody').appendChild(tr);
        if(isLocked) toggleLock(); // 重新整理鎖定狀態
    }

    // --- 5. 小工具 (含 200 字限制) ---
    function createWidget(type, data = null, styleType = 'default') {
        const board = document.getElementById('right-panel');
        const w = document.createElement('div');
        w.className = 'widget widget-' + type;
        if (styleType === 'hacker') w.classList.add('style-hacker');
        w.style.top = data?.top || '100px'; w.style.left = data?.left || '100px';
        w.style.width = data?.width || (type === 'digital' ? '250px' : '220px');
        w.style.height = data?.height || (type === 'digital' ? '120px' : '220px');

        let html = '<div class="widget-handle"></div><div class="widget-ctrl">';
        if (type === 'announce') html += '<button class="btn-widget" onclick="zoomText(this, 2)">A+</button><button class="btn-widget" onclick="zoomText(this, -2)">A-</button>';
        html += '<button class="btn-close" onclick="this.closest(\'.widget\').remove()">×</button></div>';

        if (type === 'digital') {
            html += '<div class="clock-digit">00:00:00</div>';
            new ResizeObserver(entries => { for(let entry of entries) { const d = entry.target.querySelector('.clock-digit'); if(d) d.style.fontSize = (entry.target.offsetWidth / 5) + 'px'; } }).observe(w);
        } else if (type === 'analog') {
            let svg = '<svg viewBox="0 0 100 100" style="width:95%; height:95%"><circle cx="50" cy="50" r="48" fill="white" stroke="#333" stroke-width="2"/>';
            for(let i=1; i<=12; i++) {
                let a = (i * 30) * (Math.PI / 180);
                svg += `<text x="${50+38*Math.sin(a)}" y="${50-38*Math.cos(a)}" style="font-size:8px;font-weight:bold;fill:#333;text-anchor:middle;dominant-baseline:middle;">${i}</text>`;
                svg += `<line x1="${50+44*Math.sin(a)}" y1="${50-44*Math.cos(a)}" x2="${50+48*Math.sin(a)}" y2="${50-48*Math.cos(a)}" stroke="#333" stroke-width="2"/>`;
            }
            svg += '<line x1="50" y1="50" x2="50" y2="25" class="hand hour" stroke="#333" stroke-width="4"/><line x1="50" y1="50" x2="50" y2="15" class="hand min" stroke="#666" stroke-width="3"/><line x1="50" y1="50" x2="50" y2="10" class="hand sec" stroke="red" stroke-width="1"/><circle cx="50" cy="50" r="2" fill="#333"/></svg>';
            html += svg;
        } else if (type === 'note' || type === 'announce') {
            const fs = data?.fontSize || '16px';
            html += (type === 'announce' ? '<input value="'+(data?.extra || '今日公告')+'" style="font-weight:bold; color:#e74c3c" maxlength="20">' : '') +
                    '<textarea maxlength="200" style="height:80%; font-size:'+fs+'">'+(data?.content || '')+'</textarea>';
        }
        w.innerHTML = html; board.appendChild(w); makeDraggable(w);
        if(isLocked) toggleLock(); // 重新整理鎖定狀態
    }

    function zoomText(btn, d) { const txt = btn.closest('.widget').querySelector('textarea'); let s = parseInt(window.getComputedStyle(txt).fontSize) || 16; txt.style.fontSize = (s + d) + 'px'; }

    function makeDraggable(el) {
        const h = el.querySelector('.widget-handle');
        h.addEventListener('mousedown', function(e) {
            if (isLocked) return; // 鎖定時禁止拖拽
            let ox = e.clientX - el.offsetLeft, oy = e.clientY - el.offsetTop;
            document.querySelectorAll('.widget').forEach(w => w.style.zIndex = 10); el.style.zIndex = 100;
            const move = function(ev) { el.style.left = (ev.clientX - ox) + 'px'; el.style.top = (ev.clientY - oy) + 'px'; };
            const stop = function() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', stop); };
            document.addEventListener('mousemove', move); document.addEventListener('mouseup', stop);
        });
    }

    // --- 6. 核心循環與 RWD 時鐘 ---
    function initResizableTable() {
        document.querySelectorAll('th').forEach(th => {
            const resizer = document.createElement('div'); resizer.className = 'resizer'; th.appendChild(resizer);
            resizer.addEventListener('mousedown', function(e) {
                if (isLocked) return;
                const startX = e.pageX, startW = th.offsetWidth;
                const mm = ev => { th.style.width = (startW + (ev.pageX - startX)) + 'px'; };
                const mu = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); };
                document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
            });
        });
    }

    setInterval(() => {
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0];
        document.querySelectorAll('.clock-digit').forEach(c => c.innerText = timeStr);
        document.getElementById('mobile-clock-header').innerText = timeStr; // 更新手機版時鐘

        document.querySelectorAll('.widget-analog').forEach(clock => {
            const h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds();
            clock.querySelector('.hour').style.transform = 'rotate(' + ((h*30)+(m/2)) + 'deg)';
            clock.querySelector('.min').style.transform = 'rotate(' + (m*6) + 'deg)';
            clock.querySelector('.sec').style.transform = 'rotate(' + (s*6) + 'deg)';
        });
        document.querySelectorAll('#exam-tbody tr').forEach(row => {
            try {
                const times = row.cells[1].innerText.split('-');
                const sArr = times[0].split(':'), eArr = times[1].split(':');
                const st = new Date(), et = new Date(); st.setHours(sArr[0], sArr[1], 0); et.setHours(eArr[0], eArr[1], 0);
                let p = 100; if (now > et) p = 0; else if (now > st) p = ((et - now) / (et - st)) * 100;
                const fill = row.querySelector('.energy-fill');
                if(fill) { fill.style.width = p + '%'; fill.style.backgroundColor = p > 50 ? '#4caf50' : (p > 20 ? '#ffeb3b' : '#f44336'); }
            } catch(e) {}
        });
    }, 1000);

    window.onclick = () => { if(document.getElementById('bg-selector')) document.getElementById('bg-selector').style.display='none'; };
    function toggleRowBold(btn) { if(isLocked) return; const r = btn.closest('tr'); r.style.fontWeight = (r.style.fontWeight === 'bold' ? 'normal' : 'bold'); }
    function changeFontSize(d) { if(isLocked) return; const t = document.getElementById('exam-table'); let s = parseInt(window.getComputedStyle(t).fontSize) || 16; t.style.fontSize = (s + d) + 'px'; }
    function openBgMenu(p, e) { if(isLocked) return; activePanelId = p + '-panel'; const m = document.getElementById('bg-selector'); m.style.display = 'block'; m.style.left = e.pageX + 'px'; m.style.top = e.pageY + 'px'; e.stopPropagation(); }
    function setPanelBg(s) { document.getElementById(activePanelId).style.background = s; document.getElementById('bg-selector').style.display = 'none'; }

    initResizableTable();
</script>
</body>
</html>
